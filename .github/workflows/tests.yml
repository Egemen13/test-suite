name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: API testlerini kos
        run: mvn -B clean test -pl api-tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-api
          path: allure-results

  report:
    needs: [api]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-*
          path: allure-results
          merge-multiple: true

      - name: Allure raporu uret
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - id: deployment
        uses: actions/deploy-pages@v4