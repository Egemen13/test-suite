name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Gauge kur
        run: |
          npm install -g @getgauge/cli
          gauge install java
          gauge install html-report
      - name: API senaryolarini kos
        run: mvn -B clean test-compile -pl qa-tests && mvn -B gauge:execute -pl qa-tests -DspecsDir=specs -Dtags=api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-api
          path: allure-results

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Gauge kur
        run: |
          npm install -g @getgauge/cli
          gauge install java
          gauge install html-report
      - name: Web senaryolarini kos
        run: mvn -B clean test-compile -pl qa-tests && mvn -B gauge:execute -pl qa-tests -DspecsDir=specs -Dtags=web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-web
          path: allure-results

  report:
    needs: [api, web]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-*
          path: allure-results
          merge-multiple: true
      - name: Onceki kosumun gecmisini indir
        run: |
          set +e
          mkdir -p allure-results/history
          BASE="https://egemen13.github.io/test-suite/history"
          for f in history.json history-trend.json duration-trend.json retry-trend.json categories-trend.json; do
            curl -sf -o "allure-results/history/$f" "$BASE/$f"
          done
          exit 0
      - name: Allure raporu uret
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
      - id: deployment
        uses: actions/deploy-pages@v4
