name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: API testlerini kos
        run: mvn -B clean test -pl api-tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-api
          path: allure-results

  report:
    needs: [api]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-*
          path: allure-results
          merge-multiple: true

      - name: Onceki koşumun gecmisini indir
        continue-on-error: true
        run: |
          mkdir -p allure-results/history
          curl -sf -o history.zip -L \
            "https://egemen13.github.io/test-suite/export/history.zip" || true
          curl -sf -o allure-results/history/history.json \
            "https://egemen13.github.io/test-suite/history/history.json" || true
          curl -sf -o allure-results/history/history-trend.json \
            "https://egemen13.github.io/test-suite/history/history-trend.json" || true
          curl -sf -o allure-results/history/duration-trend.json \
            "https://egemen13.github.io/test-suite/histo