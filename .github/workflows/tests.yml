name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Calistirilacak test paketi'
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - web
jobs:
  api:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'api' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: API testlerini kos (Gauge)
        run: mvn -B clean test -pl gauge-api-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-api
          path: allure-results

  web:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'web' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Playwright tarayicilarini kur
        run: mvn -B test-compile exec:java -pl gauge-tests -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium" -D exec.classpathScope=test
      - name: Web testlerini kos (Gauge)
        run: mvn -B clean test -pl gauge-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-web
          path: allure-results

  report:
    needs: [api, web]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-*
          path: allure-results
          merge-multiple: true
      - name: Onceki kosumun gecmisini indir
        run: |
          set +e
          mkdir -p allure-results/history
          BASE="https://egemen13.github.io/test-suite/history"
          for f in history.json history-trend.json duration-trend.json retry-trend.json categories-trend.json; do
            curl -sf -o "allure-results/history/$f" "$BASE/$f"
            echo "$f -> exit $?"
          done
          exit 0
      - name: Allure raporu uret
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
      - id: deployment
        uses: actions/deploy-pages@v4
